# Shmicroinvest Shmelta Pro on one server: PostgreSQL 17, the app, Caddy (automatic HTTPS)
# and a daily backup of every database. See docs/DEPLOY.md.
#
#   cd deploy && cp .env.example .env   # fill in DOMAIN and the secrets
#   docker compose up -d --build
#
name: shmelta

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # Read by initdb/01-app-role.sh on the first start: the app's own role (CREATEDB, no superuser).
      APP_DB_USER: shmelta
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}
      APP_DB_NAME: shmelta
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the app and the backup container reach it.

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: shmelta:${SHMELTA_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # One database per company is created next to this catalog database (the role needs CREATEDB).
      DATABASE_URL: postgres://shmelta:${APP_DB_PASSWORD}@db:5432/shmelta
      SHMI_SECRET: ${SHMI_SECRET:?set SHMI_SECRET in deploy/.env}
      SHMI_SETUP_TOKEN: ${SHMI_SETUP_TOKEN:-}
      # Caddy terminates HTTPS and sets X-Forwarded-Proto / X-Forwarded-For.
      TRUST_PROXY: 1
      APP_LOG: /data/shmelta.log
      TZ_COMPANY: Europe/Sofia
    volumes:
      - appdata:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Europe/Sofia
    volumes:
      - ./backup:/scripts:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    entrypoint: ["bash", "/scripts/backup-loop.sh"]

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
